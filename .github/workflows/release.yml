name: release
on:
  push:
    branches: [master]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: sh scripts/next-version_test.sh
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Compute next version
        id: version
        run: |
          # Re-run after a failed publish: HEAD is already tagged, so reuse that tag.
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then
            tag=$(sh scripts/next-version.sh)
            if [ -n "$tag" ]; then
              git tag "$tag"
              git push origin "$tag"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.version.outputs.tag != ''
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
