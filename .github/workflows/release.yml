name: release
on:
  push:
    branches: [master]
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: sh scripts/next-version_test.sh
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Compute next version
        id: version
        run: |
          # Re-run after a failed publish: HEAD is already tagged, so reuse that tag.
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then
            tag=$(sh scripts/next-version.sh)
            if [ -n "$tag" ]; then
              git tag "$tag"
              git push origin "$tag"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        if: steps.version.outputs.tag != ''
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
