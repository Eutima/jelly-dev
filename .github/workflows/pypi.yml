name: pypi
# Publishes the release that the "release" workflow just made as `jelly-dev` on PyPI: one wheel per platform that carries
# the jd binary, so `pip install jelly-dev` installs it like scripts/install.sh. Needs a trusted publisher on PyPI
# (project jelly-dev, owner Eutima, repository jelly-dev, workflow pypi.yml, environment pypi); no token is stored here.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z); empty publishes the release of the current commit
        required: false
concurrency:
  group: pypi
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  wheels:
    # a release run that failed or made no release has nothing to publish
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # a tag given by hand is built from that tag, a release run from the commit it released
          ref: ${{ github.event.inputs.tag != '' && format('refs/tags/{0}', github.event.inputs.tag) || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Find the release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            "") echo "No release tag on this commit: nothing to publish."; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "error: '$tag' is not a release tag (vX.Y.Z)" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download the release archives and check them
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist/archives
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist/archives --pattern 'jelly-dev_*' --pattern checksums.txt
          (cd dist/archives && sha256sum --check --ignore-missing checksums.txt && rm checksums.txt)
      - name: Build the wheels
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 -m unittest discover -s packaging/pypi
          python3 packaging/pypi/build_wheels.py --version "$TAG" --archives dist/archives --out dist/wheels
      - name: Check the wheels, install the Linux one and run it
        if: steps.tag.outputs.tag != ''
        run: |
          python3 -m venv /tmp/check
          /tmp/check/bin/pip install --quiet twine==6.1.0
          /tmp/check/bin/twine check dist/wheels/*.whl
          /tmp/check/bin/pip install --no-index dist/wheels/*manylinux_2_17_x86_64*.whl
          /tmp/check/bin/jd version
          /tmp/check/bin/python -m jelly_dev version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.tag.outputs.tag != ''
        with:
          name: wheels
          path: dist/wheels/*.whl
          if-no-files-found: error
  publish:
    needs: wheels
    if: needs.wheels.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI trusts this workflow, no API token is stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist
          skip-existing: true # a re-run of the same release is not an error
