# GoReleaser configuration (schema version 2).
# Local builds: `goreleaser release --snapshot --clean` (archives in dist/, nothing is published).
version: 2
project_name: jelly-dev

builds:
  - id: jelly-dev
    main: ./cmd/jelly-dev
    binary: jd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: jelly-dev
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: Eutima
    name: jelly-dev
